name: CI

on:
  push:
    branches: [ main, fix/esbuild-cors ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
